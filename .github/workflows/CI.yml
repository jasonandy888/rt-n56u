name: Build Padavan (纯净版)

on: 
  workflow_dispatch:          # 手动触发
  push:
    branches:
      - main
      - master
  pull_request:

env:
  FILE_PATH: /opt/images

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      matrix:
        include:
          - target: "K2P_nano"
          - target: "NEWIFI-MINI"

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install python-docutil unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
        fakeroot cpio git python-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Prepare toolchain
      run: |
        cd toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images

    - name: Build ${{ matrix.target }}
      run: |
        cd trunk
        if [ ! -f configs/templates/${{ matrix.target }}.config ]; then
          echo "ERROR: configs/templates/${{ matrix.target }}.config not found"
          exit 1
        fi
        cp -f configs/templates/${{ matrix.target }}.config .config
        sudo ./clear_tree
        sudo fakeroot ./build_firmware_modify ${{ matrix.target }} 0
        sudo mv -f images/*.trx /opt/images/${{ matrix.target }}.trx

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Padavan-${{ matrix.target }}
        path: /opt/images/${{ matrix.target }}.trx
