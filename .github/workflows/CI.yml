name: Build Padavan (纯净版)

on: 
  workflow_dispatch:          # 手动触发
  push:
    branches:
      - main
      - master
  pull_request:

env:
  FILE_PATH: /opt/images

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      matrix:
        include:
          - target: "K2P_nano"
          - target: "NEWIFI-MINI"

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
        fakeroot cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Prepare toolchain
      run: |
        cd toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images

    - name: Build ${{ matrix.target }}
      run: |
        cd trunk
        if [ ! -f configs/templates/${{ matrix.target }}.config ]; then
          echo "ERROR: configs/templates/${{ matrix.target }}.config not found"
          exit 1
        fi
        cp -f configs/templates/${{ matrix.target }}.config .config
        sudo ./clear_tree
        sudo fakeroot ./build_firmware_modify ${{ matrix.target }} 0
        sudo mv -f images/*.trx /opt/images/${{ matrix.target }}.trx

    - name: Upload artifact (临时下载用)
      uses: actions/upload-artifact@v4
      with:
        name: Padavan-${{ matrix.target }}
        path: /opt/images/${{ matrix.target }}.trx

  # 新增加：合并所有固件并自动发布到 Release
  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()  # 只有构建成功才发布
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: /tmp/artifacts

    - name: Prepare release files
      run: |
        mkdir -p /opt/release
        # 将所有 .trx 文件复制到发布目录
        find /tmp/artifacts -name "*.trx" -exec cp {} /opt/release/ \;
        ls -lah /opt/release

    - name: Upload to latest release
      uses: ncipollo/release-action@v1
      with:
        name: "Padavan 纯净固件 (自动编译)"
        artifacts: "/opt/release/*.trx"
        allowUpdates: true
        tag: latest
        token: ${{ secrets.GITHUB_TOKEN }}
